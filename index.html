<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben435 • Estudar Inglês</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-white text-black">

    <!-- Navbar -->
    <nav class="border-b">
        <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
            <div onclick="window.scrollTo(0,0)" class="flex items-center gap-3 cursor-pointer">
                <span class="font-semibold text-2xl tracking-tight">Ben435</span>
            </div>
            <div class="flex items-center gap-8 text-sm font-medium">
                <a href="#produtos" class="hover:text-gray-600 transition">Produtos</a>
                <a href="#solucao" class="hover:text-gray-600 transition">Solução</a>
                <a href="#preco" class="hover:text-gray-600 transition">Preço</a>
                <a href="#teste" class="hover:text-gray-600 transition">Testar</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="max-w-4xl mx-auto px-6 pt-20 pb-16 text-center">
        <h1 class="text-6xl font-semibold tracking-tighter mb-6 leading-none">
            Estude inglês de forma inteligente.
        </h1>
        <p class="max-w-2xl mx-auto text-2xl text-gray-600 mb-10">
            Melhore sua fluência conversando com um método feito para quem quer falar inglês de verdade.
        </p>
        <a href="#teste" class="inline-block bg-black hover:bg-gray-800 transition text-white font-medium px-8 py-4 rounded-2xl text-lg">
            Iniciar Teste
        </a>
    </section>

    <!-- Chat -->
    <section id="teste" class="max-w-4xl mx-auto px-6 py-16 border-t">
        <div class="text-center mb-10">
            <h2 class="text-4xl font-semibold tracking-tight mb-3">Testar</h2>
            <p class="text-gray-600">Converse abaixo e veja como funciona.</p>
        </div>

        <div class="border rounded-3xl p-6 bg-white">
            <div id="chat-box" class="h-[420px] overflow-y-auto mb-4 space-y-4 pr-2"></div>
            
            <div class="flex gap-3">
                <input id="chat-input" type="text" placeholder="Digite sua mensagem em inglês..." 
                       class="flex-1 border rounded-2xl px-5 py-3 focus:outline-none focus:border-black">
                <button onclick="sendMessage()" 
                        class="bg-black hover:bg-gray-800 transition px-8 rounded-2xl text-white font-medium">
                    Enviar
                </button>
            </div>
        </div>
    </section>

    <footer class="border-t py-8 text-center text-sm text-gray-500">
        © 2026 Ben435. Todos os direitos reservados.
    </footer>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('chat-input');

        function addMessage(role, content) {
            const div = document.createElement('div');
            if (role === 'user') {
                div.className = 'flex justify-end';
                div.innerHTML = `<div class="max-w-[75%] bg-black text-white px-4 py-3 rounded-3xl rounded-br-none">${content}</div>`;
            } else {
                div.className = 'flex justify-start';
                div.innerHTML = `<div class="max-w-[75%] bg-gray-100 px-4 py-3 rounded-3xl rounded-bl-none">${content}</div>`;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            addMessage('user', message);
            input.value = '';

            setTimeout(() => {
                const reply = `Você disse: "${message}". Essa é uma resposta de teste.`;
                addMessage('assistant', reply);
            }, 700);
        }

        setTimeout(() => {
            addMessage('assistant', 'Olá! Digite algo em inglês para começar.');
        }, 800);

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>

</body>
</html>
